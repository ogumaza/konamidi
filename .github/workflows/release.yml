# SPDX-License-Identifier: MIT

# A vX.Y.Z tag publishes a Windows x64 release. X.Y.Z must match CMakeLists.txt, with notes in
# docs/release-notes/X.Y.Z.md. The supergbamidi-X.Y.Z-win-x64.zip package contains supergbamidi.exe, README.md, LICENSE
# and THIRD_PARTY_NOTICES.
#
# A manual run (Actions > Release > Run workflow) builds the same zip and uploads it as a workflow artifact, without
# publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Read the version and check for a matching tag and release notes.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Read the version
        run: |
          version=$(sed -n 's/^project(supergbamidi VERSION \([0-9][0-9.]*\) .*/\1/p' CMakeLists.txt)
          if [ -z "$version" ]; then
            echo "::error::project() in CMakeLists.txt has no version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME doesn't match the project's version $version; expected v$version"
            exit 1
          fi
          if [ ! -f "docs/release-notes/$version.md" ]; then
            echo "::error::there are no release notes in docs/release-notes/$version.md"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          cmake -S . -B build -A x64 -DSUPERGBAMIDI_BUILD_TESTS=OFF
          cmake --build build --config Release --parallel --target supergbamidi

      # Check both --version and the version resource that Windows shows in the file's properties.
      - name: Check the version
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $said = (& build/Release/supergbamidi.exe --version) -join ''
          if ($said -ne "supergbamidi $version") { throw "--version printed '$said'; expected 'supergbamidi $version'" }
          $info = (Get-Item build/Release/supergbamidi.exe).VersionInfo
          if ($info.ProductVersion -ne $version -or $info.FileVersion -ne $version) {
            throw "the version resource has file version '$($info.FileVersion)' and product version '$($info.ProductVersion)'; expected $version"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: win-x64
          path: build/Release/supergbamidi.exe

  package:
    needs: [version, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: win-x64
          path: artifacts/win-x64

      - name: Package
        run: |
          mkdir -p dist stage
          cp artifacts/win-x64/supergbamidi.exe README.md LICENSE THIRD_PARTY_NOTICES stage/
          (cd stage && zip -q -X "../dist/supergbamidi-$VERSION-win-x64.zip" *)
          unzip -l "dist/supergbamidi-$VERSION-win-x64.zip"

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "supergbamidi $VERSION" \
            --notes-file "docs/release-notes/$VERSION.md"

      - name: Upload the package (manual run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: supergbamidi-${{ env.VERSION }}
          path: dist/
